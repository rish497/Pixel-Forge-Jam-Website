  <style>
    :root { color-scheme: dark; --night:#03050a; --panel:#0a1422; --white:#f5f7fb; --muted:#b7c8dc; --blue:#137cff; --cyan:#27d7ff; }
    * { box-sizing:border-box; }
    html { min-height:100%; }
    body { min-width:320px; min-height:100svh; margin:0; background:var(--night); color:var(--white); font-family:Manrope,Arial,sans-serif; overflow-x:hidden; }
    a { color:inherit; }
    ::selection { background:#137cff; color:white; }
    :focus-visible { outline:3px solid var(--cyan); outline-offset:5px; }
    .skip { position:absolute; top:-60px; left:20px; z-index:5; padding:10px 14px; background:var(--blue); color:white; }
    .skip:focus { top:16px; }
    .page { position:relative; z-index:1; display:flex; flex-direction:column; width:min(100%,1500px); min-height:100svh; margin:auto; }
    .cursor-glow { position:fixed; z-index:0; left:50%; top:50%; width:360px; height:360px; border-radius:50%; background:#167dff; filter:blur(105px); opacity:0; pointer-events:none; transform:translate(-50%,-50%); transition:left .18s ease-out,top .18s ease-out,opacity .25s ease-out; }
    .cursor-glow.is-visible { opacity:.22; }
    .header { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:28px clamp(22px,4.7vw,72px); }
    .brand { display:inline-flex; align-items:center; gap:12px; text-decoration:none; font-size:13px; font-weight:800; letter-spacing:.06em; white-space:nowrap; }
    .brand img { width:37px; height:37px; object-fit:contain; image-rendering:pixelated; }
    .header-link { color:#b9cbdf; font-size:13px; font-weight:700; text-decoration:none; transition:color .2s ease; }
    .header-link:hover { color:var(--cyan); }
    main { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:24px 22px 55px; }
    .hero { width:min(100%,820px); display:flex; flex-direction:column; align-items:center; text-align:center; }
    .error-number { position:relative; display:inline-block; margin:0; color:var(--blue); font-size:clamp(112px,16vw,190px); font-weight:800; line-height:.9; letter-spacing:-.055em; font-variant-numeric:tabular-nums; }
    .error-number::after { content:""; position:absolute; width:8px; height:8px; right:-16px; top:16%; background:var(--cyan); box-shadow:16px -12px 0 #0e71da,16px 7px 0 #0e71da; }
    .message { max-width:720px; padding:0; }
    h1 { margin:22px 0 0; font-size:clamp(34px,4.6vw,57px); line-height:1.12; letter-spacing:-.035em; font-weight:800; text-wrap:balance; }
    .description { max-width:560px; margin:18px auto 0; color:var(--muted); font-size:clamp(15px,1.4vw,18px); line-height:1.65; }
    .actions { display:flex; justify-content:center; margin-top:30px; }
    .button { min-height:54px; display:inline-flex; align-items:center; justify-content:center; gap:17px; padding:13px 21px; border:1px solid #52647a; border-radius:3px; font-size:14px; font-weight:800; line-height:1.2; text-decoration:none; transition:transform .2s ease,background .2s ease,border-color .2s ease,color .2s ease; }
    .button:hover { transform:translateY(-3px); }
    .button-primary { border-color:var(--blue); background:var(--blue); color:white; }
    .button-primary:hover { background:#3595ff; border-color:#3595ff; color:#03050a; }
    .button svg { width:17px; height:17px; flex:none; }
    @media (max-width:600px) { .header { padding:19px 20px; } .brand { font-size:10px; gap:7px; } .brand img { width:30px; height:30px; } .header-link { font-size:11px; } main { padding:20px 20px 54px; } .error-number { font-size:clamp(104px,25vw,145px); } h1 { margin-top:18px; } .description { margin-top:16px; } .actions { margin-top:24px; } .button { min-height:49px; padding:12px 14px; font-size:12px; } }
    @media (pointer:coarse),(prefers-reduced-motion:reduce) { .cursor-glow { display:none; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; scroll-behavior:auto !important; } }
  </style>
</head>

  <script>
    if (location.protocol === 'file:') {
      document.querySelectorAll('a[href="/"]').forEach(link => link.href = './index.html');
    }
    const glow = document.querySelector('.cursor-glow');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
    window.addEventListener('pointermove', event => {
      if (reduceMotion.matches || event.pointerType === 'touch') return;
      glow.style.left = `${event.clientX}px`;
      glow.style.top = `${event.clientY}px`;
      glow.classList.add('is-visible');
    });
    document.addEventListener('pointerleave', () => glow.classList.remove('is-visible'));
